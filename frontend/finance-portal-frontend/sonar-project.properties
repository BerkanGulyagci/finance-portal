# SonarQube — Frontend (JS/React/Vite) analizi.
# Backend Maven eklentisiyle taranır; frontend'de Maven yok → ayrı proje + sonar-scanner CLI.
# Çalıştırma: önce `npm run test:coverage` (lcov üretir), sonra sonar-scanner.
#   host.url ve token CLI'dan geçilir (token gizli, repoya yazılmaz).

sonar.projectKey=finance-portal-frontend
sonar.projectName=Finance Portal Frontend

# Kaynak + test ayrımı: testler kaynağın yanındaki __tests__/ klasöründe (colocation).
# test.inclusions ile "test kodu" sayılır, gerisi ana kaynak.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/__tests__/**,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# Coverage: Vitest (v8) lcov raporu.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Kapsam dışı (giriş noktası, kurulum, config, test yardımcıları — coverage'a katılmaz).
sonar.coverage.exclusions=src/main.jsx,src/test/**,**/__tests__/**,**/*.config.js,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# Kopya-kod (duplication) analizinden hariç: çeviri tabloları ve statik içerik datası.
# Bu dosyalar yapısı gereği benzer satırlardan oluşur ('anahtar': 'değer', her dilde
# ayrı) — bu "tekrar" yanlış pozitiftir, ortak fonksiyona çıkarılamaz/çıkarılmamalı.
# Gerçek kod tekrarı (bileşenler, util'ler) sayımda kalır.
sonar.cpd.exclusions=src/i18n/translations/**,src/features/market/economy/utils/economyContent.js

sonar.sourceEncoding=UTF-8
