server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API isteklerini backend'e proxy'le
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 120s: "Ne Olurdu?" gibi ağır hesaplar (çok varlıklı portföyde ilk/cold çağrı, tarihsel
        # seri fetch'leri) 60s'i aşabiliyordu → 504 → "Senaryo hesaplanamadı". Cold çağrının
        # tamamlanıp cache'i ısıtması için pay verildi (2.+ çağrı zaten ~ms; backend TTL cache).
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # React Router — tüm diğer istekleri index.html'e yönlendir.
    # SPA kabuğu (index.html) ASLA önbelleğe alınmamalı: yeni deploy'da dosya adları
    # hash'li asset'ler değişir, ama tarayıcı ESKİ index.html'i tutarsa ESKİ bundle'ı
    # yükler → eski bundle kaldırılmış uçlara (ör. /api/assistant/chat, /api/v1 öncesi)
    # istek atıp 404 alır → "Bir hata oluştu". no-cache ile kabuk her seferinde doğrulanır.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # index.html doğrudan istense de önbelleğe alınmasın (yukarıdaki kuralın garantisi).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static asset cache — Vite içerik-hash'li dosya adları üretir, 1 yıl güvenli/immutable.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
