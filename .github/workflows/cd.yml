# Finance Portal — Continuous Deployment (private repo: manuel-tetik deploy)
#
# Akış:
#   • main'e PUSH    → build-backend + build-frontend çalışır (image'lar
#                      Artifact Registry'e git-SHA tag'iyle push edilir). DEPLOY OLMAZ.
#   • Run workflow   → (Actions → CD → Run workflow) build + DEPLOY çalışır.
#                      Yani canlıya ancak SEN elle tetikleyince gidilir.
#
# Neden manuel-tetik: private repo + ücretsiz planda "required reviewers" onay
# kapısı yok. Bunun yerine deploy job'ı sadece workflow_dispatch'te çalışır →
# aynı güvenlik (sen tetiklemeden canlıya gitmez), repo private kalır.
#
# Kimlik doğrulama: Workload Identity Federation (anahtarsız, JSON key YOK).
# Image versiyonu git commit SHA → hangi image hangi koddan geldiği kesin.
#
# Tam otomatiğe geçmek istersen: deploy job'ındaki `if:` satırını sil
# (deploy push'ta da çalışır → push → doğrudan canlı).
#
# GEREKLİ GitHub secrets (tek seferlik): GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT

name: CD

on:
  push:
    branches: [main]
  # Deploy SADECE buradan (elle) tetiklenir
  workflow_dispatch:

# Aynı anda tek deploy; yenisi gelirse eskisini iptal etme (deploy yarıda kesilmesin)
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  GAR_LOCATION: europe-west1
  GAR_REPO: europe-west1-docker.pkg.dev/project-f3ab8cbf-895a-47c2-91d/portiva-images
  GKE_CLUSTER: portiva-cluster
  GKE_LOCATION: europe-west1
  K8S_NAMESPACE: portiva
  # Frontend build'e gömülen cloud Keycloak (verilmezse login localhost'a düşer!)
  VITE_KEYCLOAK_URL: https://8-233-66-172.nip.io
  VITE_KEYCLOAK_REALM: finance-portal

permissions:
  contents: read
  id-token: write   # Workload Identity Federation için zorunlu (OIDC token)

jobs:
  build-backend:
    name: Build & push backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build & push backend image (git-SHA + latest)
        run: |
          IMAGE="${GAR_REPO}/backend"
          docker build -t "${IMAGE}:${GITHUB_SHA::7}" -t "${IMAGE}:latest" \
            backend/finance-portal-backend
          docker push "${IMAGE}:${GITHUB_SHA::7}"
          docker push "${IMAGE}:latest"

  build-frontend:
    name: Build & push frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # Cloud Keycloak URL/realm build-arg ile gömülür (yoksa login localhost'a düşer).
      - name: Build & push frontend image (git-SHA + latest)
        run: |
          IMAGE="${GAR_REPO}/frontend"
          docker build \
            --build-arg VITE_KEYCLOAK_URL="${VITE_KEYCLOAK_URL}" \
            --build-arg VITE_KEYCLOAK_REALM="${VITE_KEYCLOAK_REALM}" \
            -t "${IMAGE}:${GITHUB_SHA::7}" -t "${IMAGE}:latest" \
            frontend/finance-portal-frontend
          docker push "${IMAGE}:${GITHUB_SHA::7}"
          docker push "${IMAGE}:latest"

  deploy:
    name: Deploy to GKE (manuel tetik)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    # DEPLOY KAPISI: yalnızca Actions → Run workflow ile tetiklenince çalışır.
    # Normal push'ta image'lar build/push edilir ama bu job ATLANIR → canlıya
    # ancak sen elle tetikleyince gidilir.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}

      - name: Roll out new images (git-SHA)
        run: |
          TAG="${GITHUB_SHA::7}"
          kubectl -n "${K8S_NAMESPACE}" set image deployment/backend \
            backend="${GAR_REPO}/backend:${TAG}"
          kubectl -n "${K8S_NAMESPACE}" set image deployment/frontend \
            frontend="${GAR_REPO}/frontend:${TAG}"

      - name: Wait for rollout to finish
        run: |
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/backend --timeout=180s
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/frontend --timeout=180s
