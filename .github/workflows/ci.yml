# Finance Portal — Continuous Integration
#
# Runs on every push and pull request targeting main. Independent jobs
# execute in parallel on Ubuntu runners:
#   1) backend-test    — Java 21, Maven verify (Surefire unit + Failsafe IT
#                        with Testcontainers Postgres + WireMock for Binance).
#                        Uploads the JaCoCo coverage report as an artifact.
#   2) log-consumer    — Java 21, Maven verify for the separate Kafka→OpenSearch
#                        log-consumer microservice (compile + tests).
#   3) frontend        — Node 20, npm ci + Vitest unit tests + Vite production build
#
# Testcontainers needs a Docker daemon; ubuntu-latest GitHub runners ship
# with Docker pre-installed.
#
# If the same branch is pushed again while a previous run is still going,
# the older run is cancelled to save CI minutes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/finance-portal-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ensure mvnw is executable
        run: chmod +x mvnw

      - name: Build and test (mvn verify)
        run: ./mvnw -B --no-transfer-progress verify

      # JaCoCo HTML + XML raporu artifact olarak yüklenir.
      # Actions sekmesi → run → Artifacts altında indirilebilir.
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/finance-portal-backend/target/site/jacoco/
          retention-days: 14

      # Surefire + Failsafe ham raporları — fail durumunda debug için
      - name: Upload Surefire / Failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/finance-portal-backend/target/surefire-reports/
            backend/finance-portal-backend/target/failsafe-reports/
          retention-days: 7

  log-consumer:
    name: Log Consumer (Java 21 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log-consumer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # log-consumer has no Maven wrapper; ubuntu-latest ships a system Maven.
      - name: Build and test (mvn verify)
        run: mvn -B --no-transfer-progress verify

  frontend:
    name: Frontend (Node 20 + Vitest + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/finance-portal-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/finance-portal-frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build (npm run build)
        run: npm run build
