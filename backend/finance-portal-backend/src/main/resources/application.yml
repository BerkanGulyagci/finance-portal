server:
  port: 8080
  # Graceful shutdown: kapatma sinyali gelince yeni istek almaz, mevcutları bitirir.
  # K8s pod rollout / replica scale-down sırasında istek kaybını önler.
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  # Aktif profil: SPRING_PROFILES_ACTIVE env değişkeniyle kontrol edilir (yoksa "dev").
  # Profiller: dev (local geliştirme, varsayılan), prod (üretim, env-only credentials),
  # test (entegrasyon testleri, scheduled job + external API kapalı).
  # Profile-özel ayarlar application-{profile}.yml dosyalarındadır; bu dosyadakiler ortak default.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Graceful shutdown'a tanınan azami süre — bu süre içinde mevcut istekler bitirilir.
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    # Ek config dosyaları (sırayla yüklenir):
    #  - news-sources.yml: haber kaynakları (RSS listesi + Finnhub + cache) — büyük statik veri,
    #    application.yml'den ayrıldı (viop-contract-specs.yml deseni). classpath'te, zorunlu.
    #  - .env.local: yerel gizli anahtarlar (gitignore), opsiyonel.
    import:
      # optional: dosya beklenmedik şekilde yoksa uygulama YİNE başlar (haberler boş kalır, çökmez).
      # Dosya jar'a gömülü olduğundan normalde her zaman vardır; bu yalnız ek güvenlik.
      - optional:classpath:news-sources.yml
      - optional:file:.env.local[.properties]
  mvc:
    contentnegotiation:
      default-content-type: application/json
      favor-parameter: false
  application:
    name: finance-portal-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/finance_portal}
    username: ${SPRING_DATASOURCE_USERNAME:berkan}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: "0"
      retries: 0
      properties:
        max.block.ms: 2000
        request.timeout.ms: 2000
        delivery.timeout.ms: 3000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/finance-portal/protocol/openid-connect/certs}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# OpenAPI 3 / Swagger UI (springdoc). Spec: /v3/api-docs — UI: /swagger-ui.html
# Tüm ortamlarda açık (iç değerlendirme için). Endpoint'ler controller'lardan otomatik taranır;
# genel bilgi + JWT auth şeması OpenApiConfig'tedir.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Uç noktaları HTTP metoduna ve ada göre sırala (okunabilirlik)
    operations-sorter: method
    tags-sorter: alpha
    # "Try it out" denemelerinde gönderilen süreyi göster
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # K8s probe'ları için liveness/readiness ayrımı.
      # liveness: süreç sağlıklı mı (hayır → pod restart).
      # readiness: trafik almaya hazır mı (hayır → Service trafik göndermez).
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
    prometheus:
      enabled: true

application:
  version: 1.0.0

# CORS izinli origin'ler. CorsConfig @Value bunu okur (@Value relaxed binding
# YAPMAZ → env'i ancak buradaki köprü ile alır). Cloud'da CORS_ALLOWED_ORIGINS
# env'i ile gerçek frontend origin'i (https://...) eklenir.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost}

app:
  logging:
    kafka:
      topic: finance-portal-logs

# Fiyat/değişim/hacim alarmları: periyodik değerlendirme + e-posta bildirimi
alarm:
  evaluation:
    enabled: ${ALARM_EVALUATION_ENABLED:true}
    fixed-rate-ms: ${ALARM_EVALUATION_FIXED_RATE_MS:60000}
    initial-delay-ms: ${ALARM_EVALUATION_INITIAL_DELAY_MS:20000}
  # Tekrarlı (RECURRING) alarmlarda art arda tetiklenmeyi önlemek için bekleme (dakika)
  recurring-cooldown-minutes: ${ALARM_RECURRING_COOLDOWN_MINUTES:60}
  mail:
    from: ${SMTP_FROM:${SMTP_USER:noreply@portiva.local}}
    from-display-name: ${SMTP_FROM_DISPLAY_NAME:Portiva}

# Bülten: dashboard özetini seçilen sıklıkta (DAILY/WEEKLY/MONTHLY) e-posta ile gönderir
newsletter:
  base-url: ${NEWSLETTER_BASE_URL:${APP_BASE_URL:http://localhost:8080}}
  digest:
    enabled: ${NEWSLETTER_DIGEST_ENABLED:true}
    # Her gün 08:00'de (Europe/Istanbul) — o gün gönderilmesi gereken abonelikler bulunur
    cron: ${NEWSLETTER_DIGEST_CRON:0 0 8 * * *}

# Warren AI — finans/ekonomi sohbet asistanı. Sağlayıcı-bağımsız (OpenAI-uyumlu); varsayılan Groq (ücretsiz).
# api-key SADECE .env.local'de tutulur (ASSISTANT_API_KEY); boşsa endpoint "şu an kullanılamıyor" döner.
assistant:
  enabled: ${ASSISTANT_ENABLED:true}
  provider: ${ASSISTANT_PROVIDER:groq}
  api-url: ${ASSISTANT_API_URL:https://api.groq.com/openai/v1/chat/completions}
  api-key: ${ASSISTANT_API_KEY:}
  model: ${ASSISTANT_MODEL:llama-3.3-70b-versatile}
  timeout-seconds: ${ASSISTANT_TIMEOUT_SECONDS:30}
  max-tokens: ${ASSISTANT_MAX_TOKENS:2000}
  temperature: ${ASSISTANT_TEMPERATURE:0.4}
  anon-message-limit: ${ASSISTANT_ANON_LIMIT:2}      # giriş yapmayan kullanıcı için toplam mesaj hakkı
  user-daily-limit: ${ASSISTANT_USER_DAILY_LIMIT:50} # giriş yapan kullanıcı için günlük mesaj hakkı
  # Anonim rate-limit IP'si X-Forwarded-For'dan SONDAN bu kadar hop geri sayılarak alınır (LB hop'u atlanır).
  # GCP harici HTTP(S) LB (GKE GCE Ingress) sona "client-ip,lb-ip" ekler → 1 doğru. Leftmost girdi
  # istemci-kontrollü/sahtelenebilir; bu yüzden leftmost ALINMAZ (aksi halde misafir limiti aşılır).
  trusted-proxy-count: ${ASSISTANT_TRUSTED_PROXY_COUNT:1}
  history-limit: ${ASSISTANT_HISTORY_LIMIT:10}        # Groq'a gönderilen son mesaj sayısı
  max-input-chars: ${ASSISTANT_MAX_INPUT_CHARS:2000}  # tek mesaj uzunluk sınırı
  cache-ttl-seconds: ${ASSISTANT_CACHE_TTL_SECONDS:21600}  # araçsız tek-soru yanıtları Redis cache (0=kapalı)
  # Gemini fallback — Groq kota/hata verince devreye girer. Anahtar: aistudio.google.com (ücretsiz)
  fallback-enabled: ${ASSISTANT_FALLBACK_ENABLED:true}
  gemini-api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
  # Model zinciri: "saglayici:model" adımları, sırayla denenir; biri kota/hata verince sonrakine düşülür.
  # saglayici = groq | gemini. Anahtarı olmayan sağlayıcı adımı atlanır. Boş bırakılırsa: Groq → Gemini.
  chain: "${ASSISTANT_CHAIN:gemini:gemini-2.5-flash,gemini:gemini-2.5-flash-lite,groq:llama-3.3-70b-versatile}"

# @Scheduled görev thread havuzu — tek-thread blocking'i önler (uzun warm-up'lar alarm gibi
# zaman-kritik job'ları geciktirmesin). Bkz. SchedulerConfig.
scheduling:
  pool-size: ${SCHEDULING_POOL_SIZE:5}

cache:
  news:
    ttl-seconds: ${NEWS_CACHE_TTL_SECONDS:300}
  portfolio:
    # 30 → 120: liste yolu artık paralel zenginleştirme yapıyor ama yine de I/O ağırlıklı
    # (sum_i N_i dış çağrı). Mutation'lar (add/update/delete tx + portföy) zaten liste key'ini
    # evict ettiği için tazelik korunur — yalnızca read-only navigasyonda bayatlık penceresi
    # 30s'den 120s'e büyür; bu da 6 paralel front-end caller'a (Header/Dashboard/Page/...) cache
    # HIT döndürür. Detay TTL ile simetrik (120s).
    list-ttl-seconds: ${CACHE_PORTFOLIO_LIST_TTL_SECONDS:120}
    # Detay cache HIT'te artık re-enrich edilmeden döner → fiyatlar en fazla bu kadar bayat olabilir.
    # 120 sn: piyasa cache'leri (60sn-6sa) yanında kabul edilebilir + refresh'ler anında. Al/sat cache'i evict eder.
    detail-ttl-seconds: ${CACHE_PORTFOLIO_DETAIL_TTL_SECONDS:120}
    watchlist-ttl-seconds: ${CACHE_PORTFOLIO_WATCHLIST_TTL_SECONDS:60}
  market:
    fx:
      tcmb:
        ttl-seconds: ${MARKET_FX_TCMB_TTL_SECONDS:21600}
      open:
        ttl-seconds: ${MARKET_FX_OPEN_TTL_SECONDS:1800}
      history:
        ttl-seconds: ${MARKET_FX_HISTORY_TTL_SECONDS:3600}
    stocks:
      ttl-seconds: 600
    crypto:
      ttl-seconds: ${CACHE_MARKET_CRYPTO_TTL_SECONDS:300}
    # Crypto Fear & Greed Index (alternative.me) — günde 1 güncellenir, 2 saat TTL fazlasıyla taze.
    feargreed:
      ttl-seconds: ${CACHE_MARKET_FEARGREED_TTL_SECONDS:7200}
    funds:
      # Fon LİSTESİ + detay. Warm-up 8 dk'da bir tazeler → TTL bundan UZUN olmalı (10 dk),
      # yoksa warm-up'lar arasında expire olup soğuk pencere oluşur (8dk<10dk; stock deseniyle aynı).
      ttl-seconds: ${CACHE_MARKET_FUNDS_TTL_SECONDS:600}
      # Fon GEÇMİŞİ (grafik): NAV günde bir kez yayınlanır, geçmiş değişmez →
      # 5 dk'da bir tüm geçmişi yeniden çekmek gereksiz; uzun TTL yeterli (varsayılan 6 saat).
      history-ttl-seconds: ${CACHE_MARKET_FUNDS_HISTORY_TTL_SECONDS:21600}
    futures:
      ttl-seconds: 300
    commodity:
      spot:
        ttl-seconds: ${MARKET_COMMODITY_SPOT_TTL_SECONDS:60}
      history:
        ttl-seconds: ${MARKET_COMMODITY_HISTORY_TTL_SECONDS:600}
    evds:
      bonds:
        active-series-ttl-seconds: ${CACHE_EVDS_BONDS_ACTIVE_SERIES_TTL_SECONDS:43200}
        # 537+ enstrümanlık liste warm-up scheduler ile 2 saatte bir tazelenir; TTL bundan uzun
        # (6 saat) ki warm-up'lar arasında expire olup kullanıcıyı soğuk yola düşürmesin.
        list-ttl-seconds: ${CACHE_EVDS_BONDS_LIST_TTL_SECONDS:21600}
        detail-ttl-seconds: ${CACHE_EVDS_BONDS_DETAIL_TTL_SECONDS:3600}
        history-ttl-seconds: ${CACHE_EVDS_BONDS_HISTORY_TTL_SECONDS:7200}
    economy:
      ttl-seconds: ${CACHE_MARKET_ECONOMY_TTL_SECONDS:21600}
    currency:
      banks:
        ttl-seconds: ${CACHE_MARKET_CURRENCY_BANKS_TTL_SECONDS:120}

market:
  # Liste cache warm-up (tahvil + fon): soğuk yükleme maliyetini kullanıcı isteğinden arka plana taşır.
  warmup:
    bonds:
      fixed-delay-ms: ${MARKET_WARMUP_BONDS_FIXED_DELAY_MS:7200000}      # 2 saat (TTL 6 saat)
      initial-delay-ms: ${MARKET_WARMUP_BONDS_INITIAL_DELAY_MS:7200000}
    funds:
      fixed-delay-ms: ${MARKET_WARMUP_FUNDS_FIXED_DELAY_MS:480000}       # 8 dakika (TTL 10 dakika)
      initial-delay-ms: ${MARKET_WARMUP_FUNDS_INITIAL_DELAY_MS:600000}
  gold:
    bist:
      url: ${MARKET_GOLD_BIST_URL:https://www.borsaistanbul.com/veri-sorgulama.php}
  precious:
    bist:
      metal-url: ${MARKET_PRECIOUS_BIST_METAL_URL:https://www.borsaistanbul.com/metal-fiyatlari.php}
  commodity:
    spot:
      ttl-seconds: ${MARKET_COMMODITY_SPOT_TTL_SECONDS:60}
    history:
      ttl-seconds: ${MARKET_COMMODITY_HISTORY_TTL_SECONDS:600}
  fx:
    tcmb:
      url: ${MARKET_FX_TCMB_URL:https://www.tcmb.gov.tr/kurlar/today.xml}
    open:
      base-url: ${MARKET_FX_OPEN_BASE_URL:https://open.er-api.com/v6/latest}
  stocks:
    yahoo:
      base-url: ${MARKET_STOCKS_YAHOO_BASE_URL:https://query1.finance.yahoo.com/v8/finance/chart}
  funds:
    rasyonet:
      filter-url: ${RASYONET_FILTER_URL:https://api.rasyonet.com/service-yatirimdirekt-home/web-fund/fund-filter}
      card-url: ${RASYONET_CARD_URL:https://api.rasyonet.com/service-yatirimdirekt-home/web-fund/card}
      osmanli-bulletin-url: ${RASYONET_OSMANLI_BULLETIN_URL:https://api.rasyonet.com/service-yatirimdirekt-home/web-menu/osmanli-fund-bulletin}
      source-code: ${RASYONET_SOURCE_CODE:TMF}
      timeout-seconds: ${RASYONET_TIMEOUT_SECONDS:15}
    tefas:
      # TEFAS resmi fon fiyat geçmişi API'si (grafik için, 5 yıla kadar derin geçmiş).
      # bearer-token: TEFAS public SPA'sinin anonim token'ı (kullanıcı kimliği değil); değişirse güncellenir.
      history-url: ${TEFAS_HISTORY_URL:https://www.tefas.gov.tr/api/funds/fonGnlBlgSiraliGetir}
      bearer-token: ${TEFAS_BEARER_TOKEN:}   # anonim TEFAS token — .env.local'de (git'e commit edilmez)
      timeout-seconds: ${TEFAS_TIMEOUT_SECONDS:20}
      chunk-days: ${TEFAS_CHUNK_DAYS:28}
      parallelism: ${TEFAS_PARALLELISM:4}

keycloak:
  admin:
    url: ${KEYCLOAK_ADMIN_URL:http://finance-portal-keycloak:8080}
    realm: ${KEYCLOAK_ADMIN_REALM:finance-portal}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:finance-portal-admin-service}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    default-user-role-name: USER
    default-user-role-id: ${KEYCLOAK_DEFAULT_USER_ROLE_ID:}
  portal:
    public-client-id: finance-portal-api
    post-verify-redirect-uri: ${KEYCLOAK_POST_VERIFY_REDIRECT_URI:http://localhost:5173/login}

ldap:
  url: ${LDAP_URL:ldap://finance-portal-apacheds:10389}
  base-dn: ${LDAP_BASE_DN:dc=openmicroscopy,dc=org}
  admin-dn: ${LDAP_ADMIN_DN:uid=admin,ou=system}
  admin-password: ${LDAP_ADMIN_PASSWORD:secret}

# FRED (St. Louis Fed) — küresel makro serileri (ABD TÜFE/CPI). Ücretsiz API anahtarı:
# https://fred.stlouisfed.org/docs/api/api_key.html  → FRED_API_KEY olarak .env.local'e ekleyin.
# Anahtar boşsa ABD CPI göstergesi sessizce "veri yok" döner (panel/grafik etkilenmez).
fred:
  base-url: ${FRED_BASE_URL:https://api.stlouisfed.org/fred}
  api-key: ${FRED_API_KEY:}

evds:
  base-url: ${EVDS_BASE_URL:https://evds3.tcmb.gov.tr/igmevdsms-dis}
  api-key: ${EVDS_API_KEY:}
  data-group: bie_pydibs
  # false → aktif tüm DİBS Değer serileri çekilir (varsayılan, ~537 enstrüman).
  # true → yalnız evds.bond-instruments listesi (kod ${evds.bond-instruments:} okur); o liste
  # buradan kaldırıldı, bu yüzden whitelist moduna geçilecekse listenin de eklenmesi gerekir.
  use-whitelist: false
  active-bonds-limit: 0         # 0 = limitsiz (tüm aktif DİBS Değer serileri — ~537 enstrüman)
  # Kira Sertifikası data group'u (Sukuk) — ek olarak DİBS yanında çekilir
  lease-cert-data-group: bie_pyks
  include-lease-certs: true     # false → kira sertifikaları yüklenmez
  # EVDS liste toplu çekiminde eşzamanlı HTTP sayısı (TCMB'yi aşırı yüklememek için 4–16 arası önerilir)
  bond-fetch-parallelism: 8

# TL mevduat stopaj oranları (yıllık %) — Cumhurbaşkanı kararıyla belirlenir, canlı API yok.
# Mevzuat değiştiğinde bu değerleri güncelle. Güncel (2026): 6 aya kadar 17.5 / 1 yıla kadar 15 / 1 yıldan uzun 10.
deposit:
  stopaj:
    up-to-6m: ${DEPOSIT_STOPAJ_6M:17.5}
    up-to-1y: ${DEPOSIT_STOPAJ_1Y:15}
    over-1y: ${DEPOSIT_STOPAJ_OVER1Y:10}

coingecko:
  base-url: ${COINGECKO_BASE_URL:https://api.coingecko.com/api/v3}
  api-key: ${COINGECKO_API_KEY:}   # gerçek anahtar .env.local / prod secret'ta (git'e commit edilmez)
  vs-currency: try

binance:
  base-url: ${BINANCE_BASE_URL:https://api.binance.com}

# Crypto Fear & Greed Index (anahtarsız, ücretsiz). Endeks günde 1 güncellenir.
feargreed:
  base-url: ${FEARGREED_BASE_URL:https://api.alternative.me}

# Ekonomik takvim — TradingView (anahtarsız, ücretsiz; Türkiye dahil 103 ülke).
# Finnhub ücretsiz planda ekonomik takvimi kaldırdığı için onun yerine geçer.
# Origin header CORS doğrulaması için zorunludur (kimlik doğrulama değil).
tradingview:
  calendar:
    url: ${TRADINGVIEW_CALENDAR_URL:https://economic-calendar.tradingview.com/events}
    origin: ${TRADINGVIEW_CALENDAR_ORIGIN:https://www.tradingview.com}

resilience4j:
  circuitbreaker:
    instances:
      yahooApi:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 70
        waitDurationInOpenState: 20s
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignoreExceptions:
          - com.finance.portal.common.application.exception.ExternalApiException
          - org.springframework.web.client.HttpClientErrorException
      coinGeckoApi:
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  retry:
    instances:
      yahooApi:
        maxAttempts: 2
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignoreExceptions:
          - com.finance.portal.common.application.exception.ExternalApiException
          - org.springframework.web.client.HttpClientErrorException
      coinGeckoApi:
        maxAttempts: 3
        waitDuration: 1s
