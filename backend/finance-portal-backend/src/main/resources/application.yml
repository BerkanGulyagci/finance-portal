server:
  port: 8080

spring:
  application:
    name: finance-portal-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/finance_portal}
    username: ${SPRING_DATASOURCE_USERNAME:berkan}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/finance-portal/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
  endpoint:
    health:
      show-details: when-authorized

application:
  version: 1.0.0

news:
  api:
    url: https://newsapi.org/v2/top-headlines
    key: ${NEWS_API_KEY:a708be2ff81e432d98abb8a2586fedc1}
  cache:
    warmup:
      fixed-delay-ms: ${NEWS_CACHE_WARMUP_FIXED_DELAY_MS:300000}

cache:
  news:
    ttl-seconds: ${NEWS_CACHE_TTL_SECONDS:300}
  market:
    fx:
      tcmb:
        ttl-seconds: ${MARKET_FX_TCMB_TTL_SECONDS:21600}
      open:
        ttl-seconds: ${MARKET_FX_OPEN_TTL_SECONDS:1800}
    stocks:
      ttl-seconds: 30
    crypto:
      ttl-seconds: ${CACHE_MARKET_CRYPTO_TTL_SECONDS:45}

market:
  fx:
    tcmb:
      url: ${MARKET_FX_TCMB_URL:https://www.tcmb.gov.tr/kurlar/today.xml}
    open:
      base-url: ${MARKET_FX_OPEN_BASE_URL:https://open.er-api.com/v6/latest}
  stocks:
    yahoo:
      base-url: https://query1.finance.yahoo.com/v8/finance/chart

coingecko:
  base-url: https://api.coingecko.com/api/v3
  api-key: ${COINGECKO_API_KEY:CG-B1V3coqfjBN6Q5Ff8j6AnpZf}
  vs-currency: try

resilience4j:
  circuitbreaker:
    instances:
      yahooApi:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      coinGeckoApi:
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  retry:
    instances:
      yahooApi:
        maxAttempts: 3
        waitDuration: 1s
      coinGeckoApi:
        maxAttempts: 3
        waitDuration: 1s
