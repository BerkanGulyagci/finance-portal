# Haber kaynakları — RSS feed listesi + Finnhub + cache warm-up.
# application.yml'den ayrıldı (büyük statik veri listesi; viop-contract-specs.yml ile aynı desen).
# spring.config.import ile application.yml'e dahil edilir; news.sources.* / news.cache.*
# anahtarları NewsSourcesProperties (@ConfigurationProperties prefix=news.sources),
# FinnhubNewsProvider (@Value) ve NewsCacheScheduler tarafından AYNEN okunur (davranış değişmez).
news:
  # Çoklu haber kaynakları. RSS anahtarsız her zaman aktif; API'ler anahtar verilince devreye girer.
  sources:
    finnhub:
      url: ${FINNHUB_API_URL:https://finnhub.io/api/v1/news}
      key: ${FINNHUB_API_KEY:}
    rss:
      # NOT: BloombergHT genel /rss'i kaldırıldı — son dakika/siyaset ağırlıklı, ekonomi az;
      # kategori-özel ekonomi uçları (/rss/ekonomi, /rss/piyasalar) 404 veriyor.
      - name: AA Ekonomi
        url: https://www.aa.com.tr/tr/rss/default?cat=ekonomi
        category: ECONOMY
        language: tr
      - name: Dünya
        url: https://www.dunya.com/rss/ekonomi.xml
        category: ECONOMY
        language: tr
      - name: NTV Ekonomi
        url: https://www.ntv.com.tr/ekonomi.rss
        category: ECONOMY
        language: tr
      - name: Hürriyet Ekonomi
        url: https://www.hurriyet.com.tr/rss/ekonomi
        category: ECONOMY
        language: tr
      - name: Sabah Ekonomi
        url: https://www.sabah.com.tr/rss/ekonomi.xml
        category: ECONOMY
        language: tr
      - name: TRT Ekonomi
        url: https://www.trthaber.com/ekonomi_articles.rss
        category: ECONOMY
        language: tr
      # NOT: Investing.com (6 feed) kaldırıldı (2026-05) — RSS yalnız başlık+link+jenerik görsel
      # veriyor (açıklama/içerik yok) ve makale sayfası Cloudflare ile Java istemcimizi engelliyor;
      # FX/Emtia/Tahvil/Hisse kapsamı classifier + ekonomimtv + kriptofoni ile zaten karşılanıyor.
      # ekonomimtv — geniş feed'ler ECONOMY bırakıldı (classifier alt kategoriye ayırır),
      # şirket haberleri STOCKS. Tümünde <enclosure> görsel + <content:encoded> tam içerik var.
      - name: ekonomim Ekonomi
        url: https://www.ekonomimtv.com/rss/ekonomi-5
        category: ECONOMY
        language: tr
      - name: ekonomim Piyasa
        url: https://www.ekonomimtv.com/rss/piyasa-9
        category: ECONOMY
        language: tr
      - name: ekonomim Yatırım
        url: https://www.ekonomimtv.com/rss/yatirim-4
        category: ECONOMY
        language: tr
      - name: ekonomim Şirket
        url: https://www.ekonomimtv.com/rss/sirket-7
        category: STOCKS
        language: tr
      # kriptofoni — kripto-özel feed'ler (kategoriye güvenilir, CRYPTO). enclosure görsel YOK
      # (görsel content:encoded içindeki ilk <img>'dan alınır), <content:encoded> tam içerik var.
      - name: Kriptofoni
        url: https://www.kriptofoni.com/kripto-para-haberleri/feed/
        category: CRYPTO
        language: tr
      - name: Kriptofoni Bitcoin
        url: https://www.kriptofoni.com/bitcoin-haberleri/feed/
        category: CRYPTO
        language: tr
      - name: Kriptofoni Altcoin
        url: https://www.kriptofoni.com/altcoin-haberleri/feed/
