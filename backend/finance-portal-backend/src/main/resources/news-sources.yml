      # Patronlar Dünyası — media:content gerçek görsel + content:encoded tam içerik var.
      # Borsa feed'i STOCKS (tip-güven); Finans karışık → ECONOMY (classifier dağıtır).
      - name: Patronlar Dünyası Borsa
        url: https://www.patronlardunyasi.com/rss/borsa
        category: STOCKS
        language: tr
      - name: Patronlar Dünyası Finans
        url: https://www.patronlardunyasi.com/rss/finans
        category: ECONOMY
        language: tr
      # Koin Bülteni — RSS'te görsel yok (og:image enrichment ile gelir, kriptofoni gibi),
      # content:encoded tam içerik var.
      - name: Koin Bülteni
        url: https://koinbulteni.com/feed
        category: CRYPTO
        language: tr
  cache:
    warmup:
      fixed-delay-ms: ${NEWS_CACHE_WARMUP_FIXED_DELAY_MS:300000}

