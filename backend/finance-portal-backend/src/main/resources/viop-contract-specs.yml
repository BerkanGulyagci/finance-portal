# VIOP Contract Specifications
# ─────────────────────────────
# Source: user-provided PSR% (from Vakif Yatirim teminat tablosu, validated against Is Yatirim margins ±0.1pp)
# Multipliers: Is Yatirim VadeliIslemler endpoint (SOZLESME_BUYUKLUGU field)
# Last sync: 2026-05-31
# Update cadence: review every 6-12 months; PSR% may drift ~%0.5/month
#
# Schema:
#   code           — underlier code, matched by F_<code>* prefix from contract symbol
#   assetClass     — SINGLE_STOCK | INDEX | FX | PRECIOUS_METAL | ENERGY | RATE | BOND
#   multiplier     — contract size (one contract represents this many units)
#   marginRate     — initial margin as decimal (Takasbank PSR via Vakif)
#   currency       — TRY or USD (currency of price quote)
#   settlementType — CASH or PHYSICAL

