services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - finance-portal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/finance-portal-backend
      dockerfile: Dockerfile
    container_name: finance-portal-backend
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEWS_API_KEY=${NEWS_API_KEY:-a708be2ff81e432d98abb8a2586fedc1}
      - NEWS_CACHE_TTL_SECONDS=${NEWS_CACHE_TTL_SECONDS:-300}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/finance_portal
      - SPRING_DATASOURCE_USERNAME=berkan
      - SPRING_DATASOURCE_PASSWORD=123
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - finance-portal-network

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller  #kafkanın KRaft modunda çalışması için broker ve controller olarak ayarlandı.
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT #henüz şifreleme için kullanılmayacak.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - finance-portal-network

  postgres:
    image: postgres:17
    container_name: finance-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_portal
      POSTGRES_USER: berkan
      POSTGRES_PASSWORD: "123"
      TZ: Europe/Istanbul
    ports:
      - "5433:5432"
    volumes:
      - finance_portal_pgdata:/var/lib/postgresql/data
    networks:
      - finance-portal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berkan -d finance_portal"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: finance-portal-keycloak
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: berkan
      KC_DB_PASSWORD: "123"
      KC_HTTP_ENABLED: "true"
      TZ: Europe/Istanbul
    ports:
      - "8081:8080"
    depends_on:
      postgres:
       condition: service_healthy
    networks:
      - finance-portal-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  apacheds:
    image: openmicroscopy/apacheds
    container_name: finance-portal-apacheds
    ports:
      - "10389:10389"
    volumes:
      - ./docker/apacheds/data:/var/lib/apacheds
    networks:
      - finance-portal-network

networks:
  finance-portal-network:
    driver: bridge

volumes:
  finance_portal_pgdata:
