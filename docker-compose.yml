services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - finance-portal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend/finance-portal-backend
      dockerfile: Dockerfile
    container_name: finance-portal-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/finance-portal-backend/.env.local
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEWS_API_KEY=${NEWS_API_KEY:-a708be2ff81e432d98abb8a2586fedc1}
      - NEWS_CACHE_TTL_SECONDS=${NEWS_CACHE_TTL_SECONDS:-300}
      - EVDS_BASE_URL=${EVDS_BASE_URL:-https://evds3.tcmb.gov.tr/igmevdsms-dis}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/finance_portal
      - SPRING_DATASOURCE_USERNAME=berkan
      - SPRING_DATASOURCE_PASSWORD=123
      # OpenTelemetry Java Agent config
      - OTEL_SERVICE_NAME=finance-portal-backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=none
      # traceId/spanId MDC'ye inject edilsin (Log4j2 ile uyumlu)
      - OTEL_INSTRUMENTATION_LOG4J_APPENDER_ENABLED=false
      - OTEL_PROPAGATORS=tracecontext,baggage
      # TEFAS scraping için proxy bypass
      - JAVA_TOOL_OPTIONS=-Djdk.http.auth.tunneling.disabledSchemes="" -Djava.net.useSystemProxies=false
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - finance-portal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend/finance-portal-frontend
      dockerfile: Dockerfile
    container_name: finance-portal-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - finance-portal-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT 0.0.0.0'a bind — container içi tüm arayüzlerden erişilebilir
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      # Advertised: container içi servisler kafka:29092, host localhost:9092 kullanır
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # Consumer group coordinator için gerekli
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - finance-portal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17
    container_name: finance-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_portal
      POSTGRES_USER: berkan
      POSTGRES_PASSWORD: "123"
      TZ: Europe/Istanbul
    ports:
      - "5433:5432"
    volumes:
      - finance_portal_pgdata:/var/lib/postgresql/data
    networks:
      - finance-portal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berkan -d finance_portal"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: finance-portal-keycloak
    command: ["start-dev"]
    env_file:
      - path: .env.local
        required: false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: berkan
      KC_DB_PASSWORD: "123"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${KC_HOSTNAME_PORT:-8081}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
      TZ: Europe/Istanbul
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
    volumes:
      - ./docker/keycloak/themes:/opt/keycloak/themes
    ports:
      - "8081:8080"
    depends_on:
      postgres:
       condition: service_healthy
    networks:
      - finance-portal-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  apacheds:
    image: openmicroscopy/apacheds
    container_name: finance-portal-apacheds
    ports:
      - "10389:10389"
    volumes:
      - ./docker/apacheds/data:/var/lib/apacheds
    networks:
      - finance-portal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: finance-portal-opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - finance-portal-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: finance-portal-opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch
    networks:
      - finance-portal-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  log-consumer:
    build:
      context: ./log-consumer
      dockerfile: Dockerfile
    container_name: finance-portal-log-consumer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
    depends_on:
      - kafka
      - opensearch
    networks:
      - finance-portal-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: finance-portal-otel-collector
    command: ["--config=/etc/otel/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC — backend agent buraya gönderir
      - "4318:4318"   # OTLP HTTP (opsiyonel, debug için)
      - "8888:8888"   # Collector kendi metrikleri (opsiyonel)
    networks:
      - finance-portal-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  finance-portal-network:
    driver: bridge

volumes:
  finance_portal_pgdata:
  opensearch_data:
