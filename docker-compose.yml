version: '3.8'

services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - finance-portal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/finance-portal-backend
      dockerfile: Dockerfile
    container_name: finance-portal-backend
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEWS_API_KEY=${NEWS_API_KEY:-your-api-key-here}
      - NEWS_CACHE_TTL_SECONDS=${NEWS_CACHE_TTL_SECONDS:-300}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - finance-portal-network

networks:
  finance-portal-network:
    driver: bridge
