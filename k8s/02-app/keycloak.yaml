# Keycloak — Identity Provider (quay.io/keycloak/keycloak:26.0).
# Realm import tek instance'ta çalışmalı → replicas: 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: portiva
  labels:
    app: keycloak
    tier: app
spec:
  replicas: 1 # Realm import tek instance olmalı
  selector:
    matchLabels:
      app: keycloak
  strategy:
    type: Recreate # Tek instance — eski pod ölmeden yenisi DB'ye bağlanmasın
  template:
    metadata:
      labels:
        app: keycloak
        tier: app
    spec:
      containers:
        - name: keycloak
          # Custom image: base keycloak:26.0 + gömülü "finance-portal" login teması.
          # v4: "Kayıt Ol" linki redirect_uri origin'inden türetilir (cluster'da nip.io'ya gider).
          image: europe-west1-docker.pkg.dev/project-f3ab8cbf-895a-47c2-91d/portiva-images/keycloak:v4
          imagePullPolicy: Always
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
              name: http
            # Keycloak 26: /health/* ve /metrics management portunda (9000).
            - containerPort: 9000
              name: management
          env:
            # --- Bootstrap admin ---
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            # --- Veritabanı ---
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres:5432/keycloak"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: KC_DB_PASSWORD
            # --- HTTP / hostname ---
            - name: KC_HTTP_ENABLED
              value: "true"
            # Keycloak 26'da /health/* varsayılan kapalı; KC_HEALTH_ENABLED ile açılır (port 9000).
            - name: KC_HEALTH_ENABLED
              value: "true"
            # DİNAMİK hostname (hostname v2): KC_HOSTNAME hiç set EDİLMEZ.
            # KC_HOSTNAME_STRICT=false + KC_PROXY_HEADERS=xforwarded ile Keycloak
            # issuer/authorization/admin URL'lerini gelen isteğin Host / X-Forwarded-* header'ından ÜRETİR:
            #   - nip.io'dan gelen cloud login  → issuer = https://8-233-66-172.nip.io (frontend bunu bekler, LOGIN sürer)
            #   - localhost:8082'den gelen admin → authServerUrl = localhost:8082 (port-forward admin console TAM çalışır)
            - name: KC_HOSTNAME_STRICT
              value: "false"
            # --- Cloud HTTPS (LB arkasında) ---
            # Proxy header'larını oku ki nip.io'dan gelen istekte üretilen URL https://<nip.io> olsun (internal http değil).
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            # GERİ ALMA (login bozulursa): aşağıdaki ikisini geri aç → sabit nip.io'ya dön.
            # NOT: KC_HOSTNAME_ADMIN, KC_HOSTNAME'in tam URL set edilmesini ZORUNLU kılar; ikisi BİRLİKTE açılır/kapanır.
            # - name: KC_HOSTNAME
            #   value: "https://8-233-66-172.nip.io"
            # - name: KC_HOSTNAME_ADMIN
            #   value: "https://8-233-66-172.nip.io"
            # --- Tema cache (dev) ---
            - name: KC_SPI_THEME_CACHE_THEMES
              value: "false"
            - name: KC_SPI_THEME_CACHE_TEMPLATES
              value: "false"
            # --- Zaman dilimi ---
            - name: TZ
              value: "Europe/Istanbul"
          # startupProbe: ilk başlangıç (realm import + DB migration) cloud'da yavaş; 30×15s = 7.5 dk tolerans.
          startupProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
          # Realm import: keycloak-realm-import ConfigMap'i import dizinine mount → --import-realm yükler.
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: portiva
  labels:
    app: keycloak
    tier: app
  annotations:
    # GCLB health check'ini /realms/master'a yönlendir (kök "/" 302 → UNHEALTHY → 502 yapıyordu).
    cloud.google.com/backend-config: '{"default": "keycloak-bconfig"}'
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
