# =============================================================================
# Keycloak (Identity Provider) — quay.io/keycloak/keycloak:26.0
# Docker Compose 'keycloak' servisinden uyarlandı.
#
# TODO: Realm import (./docker/keycloak/import) ve theme override
#       (./docker/keycloak/themes) volume mount'ları BURADA ATLANDI.
#       Bunlar ConfigMap/initContainer ile sonra eklenecek.
#       --import-realm boş import klasörüyle de sorunsuz başlar; sadece
#       herhangi bir realm IMPORT ETMEZ (Keycloak ayağa kalkar).
#
# Realm import tek instance'ta çalışmalı → replicas: 1.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: portiva
  labels:
    app: keycloak
    tier: app
spec:
  replicas: 1 # Realm import tek instance olmalı
  selector:
    matchLabels:
      app: keycloak
  strategy:
    type: Recreate # Tek instance — eski pod ölmeden yenisi DB'ye yapışmasın
  template:
    metadata:
      labels:
        app: keycloak
        tier: app
    spec:
      containers:
        - name: keycloak
          # Custom image: özel "finance-portal" login teması gömülü (docker/keycloak/Dockerfile).
          # Base quay.io/keycloak/keycloak:26.0 + COPY themes/finance-portal.
          image: europe-west1-docker.pkg.dev/project-f3ab8cbf-895a-47c2-91d/portiva-images/keycloak:v3
          imagePullPolicy: Always
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
              name: http
            # Keycloak 26: /health/* ve /metrics MANAGEMENT portunda (9000), 8080'de değil.
            - containerPort: 9000
              name: management
          env:
            # --- Bootstrap admin ---
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            # --- Veritabanı ---
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres:5432/keycloak"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: KC_DB_PASSWORD
            # --- HTTP / hostname ---
            - name: KC_HTTP_ENABLED
              value: "true"
            # Keycloak 26'da /health/* endpoint'leri VARSAYILAN KAPALI → probe'lar 'connection
            # refused/404' alip pod'u olduruyordu. KC_HEALTH_ENABLED ile acilir (port 9000 management).
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            # --- Cloud HTTPS (LB arkasında) ---
            # Keycloak HTTPS Ingress (GCLB) arkasında çalışır. Proxy header'larını oku ki
            # üretilen URL'ler (redirect/issuer) https://<nip.io> olsun, internal http değil.
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            # Keycloak'ın kendini tanıttığı dış hostname (frontend bu URL'e yönlendirir).
            - name: KC_HOSTNAME
              value: "https://8-233-66-172.nip.io"
            # Admin konsolu için de aynı hostname (yoksa admin'e erişim kırılır).
            - name: KC_HOSTNAME_ADMIN
              value: "https://8-233-66-172.nip.io"
            # --- Tema cache (dev) ---
            - name: KC_SPI_THEME_CACHE_THEMES
              value: "false"
            - name: KC_SPI_THEME_CACHE_TEMPLATES
              value: "false"
            # --- Zaman dilimi ---
            - name: TZ
              value: "Europe/Istanbul"
          # startupProbe: Keycloak ilk başlangıçta (realm import + DB schema migration) cloud'da
          # ÇOK yavaş (5+ dk olabilir). startupProbe başarana kadar liveness/readiness DEVRE DIŞI →
          # başlangıçta erken öldürülmez. 30 × 15s = 7.5 dk tolerans.
          startupProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
          # Realm import: keycloak-realm-import ConfigMap (cloud kopyası, nip.io redirect URI'li)
          # /opt/keycloak/data/import'a mount edilir → --import-realm bunu yükler.
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: portiva
  labels:
    app: keycloak
    tier: app
  annotations:
    # GCLB health check'ini /realms/master'a yönlendir (kök "/" 302 dönüp UNHEALTHY → 502 yapıyordu).
    cloud.google.com/backend-config: '{"default": "keycloak-bconfig"}'
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
