# =============================================================================
# BackendConfig — GKE Ingress (GCLB) health check'ini özelleştirir.
#
# SORUN: GCLB backend'i /actuator/health (AGGREGATE) ile kontrol ediyordu.
#        Aggregate health, MailHealthIndicator (Gmail SMTP rate-limit) yüzünden
#        503 dönüyor → GCLB backend'i UNHEALTHY işaretliyor → Ingress 502.
#
# ÇÖZÜM: GCLB health check'ini /actuator/health/readiness'e yönlendir
#        (sadece db+redis kontrol eder, mail YOK — application.yml'deki grup).
#
# Backend Service'e annotation ile bağlanır:
#   cloud.google.com/backend-config: '{"default": "backend-bconfig"}'
# =============================================================================
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: backend-bconfig
  namespace: portiva
spec:
  healthCheck:
    type: HTTP
    requestPath: /actuator/health/readiness
    port: 8080
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 3
  # Yük altında uzun isteklerin kesilmemesi için timeout
  timeoutSec: 120
