# BackendConfig — GCLB health check'ini /actuator/health/readiness'e yönlendirir
# (aggregate health, MailHealthIndicator yüzünden 503 dönüp Ingress'i 502 yapıyordu;
# readiness sadece db+redis kontrol eder, mail YOK).
# Backend Service annotation ile bağlanır: cloud.google.com/backend-config.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: backend-bconfig
  namespace: portiva
spec:
  healthCheck:
    type: HTTP
    requestPath: /actuator/health/readiness
    port: 8080
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 3
  # Yük altında uzun istekler kesilmesin diye timeout.
  timeoutSec: 120
