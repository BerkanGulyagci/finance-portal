# Keycloak BackendConfig — GCLB health check'ini /realms/master'a yönlendirir
# (kök "/" 302 redirect dönüp UNHEALTHY → 502 yapıyordu; /realms/master daima 200).
# Not: health/ready port 9000'de, ama Service 8080 expose ettiği için 8080'de 200 dönen path kullanılır.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: keycloak-bconfig
  namespace: portiva
spec:
  healthCheck:
    type: HTTP
    requestPath: /realms/master
    port: 8080
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 3
  timeoutSec: 60
