# HTTPS Ingress — nip.io hostname + GKE ManagedCertificate (otomatik Let's Encrypt).
# HTTPS şart: login PKCE crypto.subtle yalnızca secure context'te çalışır.
# nip.io hostname → 8.233.66.172 (DNS gerekmez; ManagedCertificate ham IP'ye verilemez).
# Routing (same-origin): /realms,/resources,/admin → keycloak:8080, /api → backend:8080, /* → frontend:80.
# Not: ManagedCertificate provizyonu 15-60 dk sürebilir.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: portiva-cert
  namespace: portiva
spec:
  domains:
    - 8-233-66-172.nip.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portiva-ingress
  namespace: portiva
  annotations:
    kubernetes.io/ingress.class: "gce"
    # ManagedCertificate'i bu Ingress'e bağla (HTTPS).
    networking.gke.io/managed-certificates: "portiva-cert"
    # HTTP'yi açık tut (HTTPS hazır olana kadar fallback).
    kubernetes.io/ingress.allow-http: "true"
spec:
  rules:
    - host: 8-233-66-172.nip.io
      http:
        paths:
          # Keycloak OAuth endpoint'leri (same-origin login)
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          # Keycloak login teması statik dosyaları
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          # NOT: /admin Keycloak'a YÖNLENDİRİLMEZ — uygulamanın kendi /admin/users
          # frontend route'u ile çakışıyordu (Keycloak'a gidip "internal error" veriyordu).
          # Keycloak admin konsolu güvenlik için internete açılmaz; port-forward ile erişilir.
          # Backend API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # Frontend SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
