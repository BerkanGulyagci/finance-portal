# HPA — backend'i CPU yüküne göre otomatik ölçekler.
# CPU ortalaması %50'yi geçince scale UP, düşünce scale DOWN.
# Çalışması için deployment'ta resource requests şart (cpu 500m → %50 = 250m eşiği).
# İzleme: kubectl get hpa -n portiva -w
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: portiva
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  # min 2 → biri yenilenirken diğeri trafiği taşır (PDB ile zero-downtime)
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    # Hızlı scale UP, yavaş scale DOWN.
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
