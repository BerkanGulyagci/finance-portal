# Ingress — frontend + backend dış erişim (GKE controller EXTERNAL IP ayırır).
# Routing: /api → backend:8080 (Spring Boot), /* → frontend:80 (nginx SPA).
# Not: nginx de /api proxy'liyor; Ingress'te path-based routing daha K8s-native.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portiva-ingress
  namespace: portiva
  annotations:
    # GKE yönetilen L7 load balancer (external IP verir).
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - http:
        paths:
          # /api → backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # diğer her şey → frontend (nginx SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
