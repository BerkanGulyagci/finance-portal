# =============================================================================
# Ingress — dış dünyadan frontend + backend'e erişim.
# GKE Ingress controller bir EXTERNAL IP ayırır (birkaç dakika sürer).
#
# Yönlendirme:
#   /api/*  → backend:8080  (Spring Boot API)
#   /*      → frontend:80   (nginx SPA)
#
# NOT: nginx zaten /api'yi backend'e proxy'liyor; ama Ingress seviyesinde de
#      /api'yi doğrudan backend'e yönlendirmek daha temiz (frontend'i bypass).
#      Basit tutmak için TÜM trafiği frontend'e verip nginx proxy'sine
#      güvenebiliriz de — ama path-based routing daha "K8s-native".
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portiva-ingress
  namespace: portiva
  annotations:
    # GKE'nin yönetilen L7 load balancer'ını kullan (external IP verir).
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - http:
        paths:
          # /api/* → backend (Spring Boot)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # Diğer her şey → frontend (nginx SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
