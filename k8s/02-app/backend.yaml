# Backend — Spring Boot finance-portal-backend (image: <registry>/backend:v1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: portiva
  labels:
    app: backend
    tier: app
spec:
  replicas: 2 # HPA bu Deployment'a takılır
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: app
    spec:
      containers:
        - name: backend
          image: europe-west1-docker.pkg.dev/project-f3ab8cbf-895a-47c2-91d/portiva-images/backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            # --- Redis ---
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            # --- Kafka ---
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            # --- PostgreSQL ---
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/finance_portal"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_PASSWORD
            # --- EVDS (TCMB) ---
            - name: EVDS_BASE_URL
              value: "https://evds3.tcmb.gov.tr/igmevdsms-dis"
            # --- Keycloak K8s override'ları ---
            # Explicit env, envFrom secret'taki yanlış compose adını EZER → doğru Service'e bağlanır.
            - name: KEYCLOAK_ADMIN_URL
              value: "http://keycloak:8080"
            - name: KEYCLOAK_JWK_SET_URI
              value: "http://keycloak:8080/realms/finance-portal/protocol/openid-connect/certs"
            # Doğrulama sonrası cloud frontend'ine yönlendir.
            - name: KEYCLOAK_POST_VERIFY_REDIRECT_URI
              value: "https://8-233-66-172.nip.io/login"
            # --- LDAP (apacheds) K8s override ---
            # Default 'finance-portal-apacheds' compose adı; K8s Service adı 'apacheds'.
            # Yanlış host → kayıt (LDAP'a yazma) 500 veriyordu.
            - name: LDAP_URL
              value: "ldap://apacheds:10389"
            # --- OpenTelemetry Java Agent ---
            - name: OTEL_SERVICE_NAME
              value: "finance-portal-backend"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
            - name: OTEL_INSTRUMENTATION_LOG4J_APPENDER_ENABLED
              value: "false"
            # --- JVM / TEFAS proxy bypass ---
            - name: JAVA_TOOL_OPTIONS
              value: '-Djdk.http.auth.tunneling.disabledSchemes="" -Djava.net.useSystemProxies=false'
          # backend-secrets içindeki tüm değerler toplu yüklenir (API key'ler, SMTP_*, vb.)
          envFrom:
            - secretRef:
                name: backend-secrets
          # Probe'lar aggregate /actuator/health DEĞİL, kritik bileşen gruplarını kullanır
          # (mail hariç) — MailHealthIndicator 503'ü aggregate'i DOWN yapıp pod'u READY olmaktan alıkoyuyordu.
          # startupProbe: Spring Boot başlangıç toleransı.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          # readiness: trafik almaya hazır mı (db+redis UP, mail hariç).
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          # liveness: süreç canlı mı (livenessState); dış bağımlılıklara bakmaz → gereksiz restart yok.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 12
          resources:
            requests:
              memory: "768Mi"
              cpu: "500m"
            # CPU limiti 2: yük altında throttle olmasın.
            limits:
              memory: "1.5Gi"
              cpu: "2"
          # preStop: pod ölmeden 15sn bekle → GCLB onu endpoint'ten çıkarsın
          # (yenilenirken gelen istek kapanan pod'a düşmesin → zero-downtime).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: portiva
  labels:
    app: backend
    tier: app
  annotations:
    # GCLB health check'ini /actuator/health/readiness'e yönlendir (aggregate mail yüzünden 503 → 502 yapıyordu).
    cloud.google.com/backend-config: '{"default": "backend-bconfig"}'
spec:
  type: ClusterIP # Ingress dışa açar
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
