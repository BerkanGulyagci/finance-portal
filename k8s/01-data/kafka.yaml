# Kafka — KRaft tek node (broker+controller), StatefulSet + PVC (kalıcı log).
# Service "kafka": iç erişim kafka:29092, controller quorum kafka:29093.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: portiva
  labels:
    app: kafka
    tier: data
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        tier: data
    spec:
      # fsGroup volume'u grup 1000'e devreder; aksi halde appuser(1000) PVC'ye yazamaz.
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.1.1
          ports:
            - name: internal
              containerPort: 29092
            - name: controller
              containerPort: 29093
            - name: host
              containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            # 0.0.0.0'a bind — pod içi tüm arayüzlerden erişilebilir
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
            # Advertised: pod'un stable DNS'i (kafka-0.kafka) — düz ClusterIP controller portuna
            # route edemeyip "channel manager timed out" veriyordu. Diğer servisler kafka:29092 ile erişir.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka.portiva.svc.cluster.local:29092,PLAINTEXT_HOST://localhost:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            # Controller quorum: pod'un kendi stable DNS'i (headless service).
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka.portiva.svc.cluster.local:29093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LOG_DIRS
              # Alt-klasör kullan → ext4 'lost+found'u görmez (Kafka onu topic sanıp çöküyordu).
              value: /var/lib/kafka/data/logs
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            # Consumer group coordinator için gerekli
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            # JVM heap'i memory limit altında tut (OOMKill riski).
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          # startupProbe: KRaft başlangıcı (quorum + log recovery) cloud'da yavaş; 30×10s = 5 dk tolerans.
          startupProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
        labels:
          app: kafka
          tier: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: portiva
  labels:
    app: kafka
    tier: data
spec:
  # Headless (clusterIP: None) → pod'a stable DNS (kafka-0.kafka); KRaft controller için şart.
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: internal
      port: 29092
      targetPort: 29092
    - name: host
      port: 9092
      targetPort: 9092
    - name: controller
      port: 29093
      targetPort: 29093
