# ApacheDS (LDAP) — StatefulSet + PVC (dizin verisi kalıcı).
# Service adı: "apacheds", port 10389 → backend LDAP'a apacheds:10389 ile bağlanır.
# kubectl apply -f k8s/01-data/apacheds.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apacheds
  namespace: portiva
  labels:
    app: apacheds
    tier: data
spec:
  serviceName: apacheds
  replicas: 1
  selector:
    matchLabels:
      app: apacheds
  template:
    metadata:
      labels:
        app: apacheds
        tier: data
    spec:
      containers:
        - name: apacheds
          image: openmicroscopy/apacheds
          ports:
            - name: ldap
              containerPort: 10389
          volumeMounts:
            - name: apacheds-data
              mountPath: /var/lib/apacheds
          readinessProbe:
            tcpSocket:
              port: 10389
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 10389
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: apacheds-data
        labels:
          app: apacheds
          tier: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: apacheds
  namespace: portiva
  labels:
    app: apacheds
    tier: data
spec:
  type: ClusterIP
  selector:
    app: apacheds
  ports:
    - name: ldap
      port: 10389
      targetPort: 10389
