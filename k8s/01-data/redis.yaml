# Redis — uygulama cache katmanı (kalıcı veri YOK, volume kullanmaz).
# Service adı: "redis", port 6379 → backend REDIS_HOST=redis, REDIS_PORT=6379 ile bağlanır.
# kubectl apply -f k8s/01-data/redis.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: portiva
  labels:
    app: redis
    tier: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: data
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: portiva
  labels:
    app: redis
    tier: data
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
