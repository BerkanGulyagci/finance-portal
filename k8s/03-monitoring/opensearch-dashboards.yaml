# OpenSearch Dashboards — OpenSearch log verisini görselleştiren web arayüzü (Kibana muadili).
# OPENSEARCH_HOSTS=http://opensearch:9200 ile cluster-içi OpenSearch'e bağlanır, güvenlik plugin'i KAPALI.
# Service adı: "opensearch-dashboards", port 5601.
# İNTERNETE KAPALI (ClusterIP) — erişim: kubectl port-forward svc/opensearch-dashboards 5601:5601
# kubectl apply -f k8s/03-monitoring/opensearch-dashboards.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: portiva
  labels:
    app: opensearch-dashboards
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-dashboards
  template:
    metadata:
      labels:
        app: opensearch-dashboards
        tier: monitoring
    spec:
      containers:
        - name: opensearch-dashboards
          image: opensearchproject/opensearch-dashboards:2.11.0
          ports:
            - name: http
              containerPort: 5601
          env:
            - name: OPENSEARCH_HOSTS
              value: http://opensearch:9200
            - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
              value: "true"
          readinessProbe:
            tcpSocket:
              port: 5601
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
  namespace: portiva
  labels:
    app: opensearch-dashboards
    tier: monitoring
spec:
  type: ClusterIP
  selector:
    app: opensearch-dashboards
  ports:
    - name: http
      port: 5601
      targetPort: 5601
