# Grafana — gözlemlenebilirlik panosu (Deployment + PVC); Prometheus/Tempo/OpenSearch datasource'ları.
# Admin şifresi "db-secrets" Secret'ından (GRAFANA_ADMIN_PASSWORD). Service "grafana":3000.
# İnternete kapalı (ClusterIP) — erişim: kubectl port-forward svc/grafana 3000:3000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: portiva
  labels:
    app: grafana
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        tier: monitoring
    spec:
      # PVC root'u root'a ait; grafana(472) /var/lib/grafana'ya yazamıyor → fsGroup devreder.
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            # Resmi OpenSearch datasource eklentisi (Elasticsearch değil).
            - name: GF_INSTALL_PLUGINS
              value: grafana-opensearch-datasource
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            # TODO: provisioning (datasource + dashboard) ConfigMap ile /etc/grafana/provisioning'e mount.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
---
# Grafana kalıcı veri (dashboard/datasource/kullanıcı) PVC'si.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: portiva
  labels:
    app: grafana
    tier: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: portiva
  labels:
    app: grafana
    tier: monitoring
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
